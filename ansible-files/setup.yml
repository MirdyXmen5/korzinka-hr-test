---
- name: Setup Docker + Nginx Proxy Manager
  hosts: all          # или укажи нужную группу, например ddvps
  become: true        # выполняем всё от root

  tasks:
    # 1. Обновление системы
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true

    # 2. Установка Docker (официальный удобный способ)
    - name: Install required packages for Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # 3. Создание директории для Nginx Proxy Manager
    - name: Create directory for Nginx Proxy Manager
      ansible.builtin.file:
        path: /opt/npm
        state: directory
        mode: '0755'

    # 4. Создание docker-compose.yml
    - name: Create docker-compose.yml for Nginx Proxy Manager
      ansible.builtin.copy:
        dest: /opt/npm/docker-compose.yml
        mode: '0644'
        content: |
          services:
            app:
              image: 'jc21/nginx-proxy-manager:latest'
              restart: unless-stopped
              ports:
                - '80:80'
                - '81:81'
                - '443:443'
              volumes:
                - ./data:/data
                - ./letsencrypt:/etc/letsencrypt

    # 5. Запуск Nginx Proxy Manager
    - name: Start Nginx Proxy Manager
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/npm
      register: npm_result
      changed_when: "'Started' in npm_result.stderr or 'Creating' in npm_result.stderr"

    - name: Show success message
      ansible.builtin.debug:
        msg: "Setup complete! Nginx Proxy Manager is running on port 81."
